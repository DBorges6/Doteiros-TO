# Teste temporário: o Dotabuff e o OpenDota respondem a um servidor na nuvem?
name: Teste de coleta na nuvem
on:
  push:
    paths: [".github/workflows/teste-nuvem.yml"]
  workflow_dispatch:

jobs:
  opendota:
    runs-on: ubuntu-latest
    steps:
      - name: OpenDota responde?
        run: |
          code=$(curl -s -o /tmp/od.json -w "%{http_code}" https://api.opendota.com/api/players/151490176)
          echo "HTTP $code"; head -c 200 /tmp/od.json; echo
          test "$code" = "200"

  dotabuff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instala Playwright
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Dotabuff abre a página de um jogador?
        run: |
          cat > t.py <<'EOF'
          import sys
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              b = pw.chromium.launch(headless=True, args=["--disable-blink-features=AutomationControlled"])
              pg = b.new_context(locale="pt-BR", user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36").new_page()
              r = pg.goto("https://pt.dotabuff.com/players/151490176", wait_until="domcontentloaded", timeout=60000)
              print("status HTTP:", r.status if r else None)
              try:
                  pg.wait_for_selector(".header-content-title h1", timeout=30000)
                  print("OK: página carregou:", pg.inner_text(".header-content-title h1").split("\n")[0])
              except Exception:
                  print("BLOQUEADO. Título:", pg.title()); print(pg.inner_text("body")[:300]); sys.exit(1)
          EOF
          python t.py
