# Atualiza o dashboard todo dia na nuvem, sem depender de nenhum PC ligado.
# Coleta Dotabuff + OpenDota, gera os dados e faz commit; a Hostinger publica a cada push.
name: Atualizar dashboard

on:
  schedule:
    - cron: "0 13 * * *"   # 10:00 em Brasília (13:00 UTC)
  workflow_dispatch:        # botão "Run workflow" na aba Actions do GitHub
  push:
    paths: [".github/workflows/atualizar.yml"]   # roda quando este arquivo muda

permissions:
  contents: write

concurrency:
  group: atualizar-dashboard
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Sao_Paulo
      PYTHONIOENCODING: utf-8
      BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache das imagens (heróis, avatares, medalhas)
        uses: actions/cache@v4
        with:
          path: data/img_cache
          key: img-cache-${{ github.run_id }}
          restore-keys: img-cache-

      - name: Instala dependências
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: OpenDota (duplas e histórico)
        run: python fetch.py || echo "OpenDota falhou; seguindo com o histórico salvo"

      - name: Dotabuff
        run: python scraper/scrape_dotabuff.py

      - name: Gera o dashboard
        run: python build_data.py

      - name: Salva no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Atualiza dados do dashboard ($(date '+%d/%m/%Y %H:%M'), nuvem)"
          git pull --rebase
          git push
